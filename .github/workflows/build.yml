name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build exe
        run: pyinstaller --onefile --noconsole --name IPAInstaller --collect-all pymobiledevice3 app.py
      - uses: actions/upload-artifact@v4
        with:
          name: IPAInstaller-windows
          path: dist/IPAInstaller.exe
